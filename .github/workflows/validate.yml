name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate repository contract
        run: python scripts/validate_repo.py

      - name: Validate benchmark sample sheet
        run: python scripts/validate_samplesheet.py assets/test-data/samplesheet.csv --check-paths

      - name: Normalize fixture metrics
        run: python scripts/summarize_metrics.py assets/test-data/metrics.fixture.tsv --output /tmp/summary.tsv --markdown /tmp/summary.md

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: '24.04.6'

      - name: Run DSL2 stub benchmark
        run: nextflow run main.nf -profile test -stub-run --outdir /tmp/assembly-shootout-results
